services:
  - type: web
    name: curegenie-backend
    runtime: python
    plan: free
    buildCommand: apt-get update && apt-get install -y libzbar0 libzbar-dev && pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port 10000
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
